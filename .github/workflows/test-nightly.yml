name: Nightly E2E Tests

on:
  schedule:
    # Run at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv pip install --system -e ".[test]"
    
    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        sleep 5
    
    - name: Pull gemma4:e2b model
      run: |
        ollama pull gemma4:e2b
    
    - name: Run golden dataset and adversarial tests
      run: |
        PYTHONPATH=. uv run pytest -m "golden or adversarial" tests/ \
          --cov=src \
          --cov-report=html:tests/reports/coverage/nightly \
          --cov-report=xml:tests/reports/coverage/coverage-nightly.xml \
          --cov-report=term \
          --html=tests/reports/pytest/nightly.html \
          --self-contained-html \
          -v \
          --tb=short
    
    - name: Generate timestamp
      id: timestamp
      run: echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
    
    - name: Save metrics
      if: always()
      run: |
        mkdir -p tests/reports/metrics
        TIMESTAMP="${{ steps.timestamp.outputs.timestamp }}"
        
        # Extract test results
        TOTAL=$(grep -oP 'collected \K\d+' tests/reports/pytest/nightly.html || echo "0")
        PASSED=$(grep -oP 'passed=\K\d+' tests/reports/pytest/nightly.html || echo "0")
        FAILED=$(grep -oP 'failed=\K\d+' tests/reports/pytest/nightly.html || echo "0")
        
        # Extract coverage
        COVERAGE=$(uv run coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//' || echo "0")
        
        # Create metrics JSON
        cat > tests/reports/metrics/metrics-${TIMESTAMP}.json <<EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "test_phase": "nightly",
          "total_tests": ${TOTAL},
          "passed": ${PASSED},
          "failed": ${FAILED},
          "skipped": 0,
          "duration_seconds": 0,
          "coverage_percent": ${COVERAGE}
        }
        EOF
        
        echo "Metrics saved to tests/reports/metrics/metrics-${TIMESTAMP}.json"
    
    - name: Analyze metrics and generate trends
      if: always()
      run: |
        # Install matplotlib for chart generation
        uv pip install --system matplotlib
        
        # Run metrics analysis
        python scripts/analyze_metrics.py || echo "Metrics analysis completed with warnings"
    
    - name: Generate report dashboard
      if: always()
      run: |
        python scripts/generate_report_dashboard.py
    
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-nightly-${{ steps.timestamp.outputs.timestamp }}
        path: tests/reports/
        retention-days: 90
    
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: tests/reports/coverage/coverage-nightly.xml
        flags: e2e,adversarial
        name: nightly-coverage
    
    - name: Check for test failures
      if: failure()
      run: |
        echo "❌ Nightly tests failed!"
        echo "Check the test reports artifact for details."
    
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '❌ Nightly E2E Tests Failed',
            body: `Nightly test run failed on ${new Date().toISOString()}\n\nCheck the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`,
            labels: ['test-failure', 'nightly']
          })
