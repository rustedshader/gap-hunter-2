name: Full Test Suite

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      coverage_threshold:
        description: 'Minimum coverage percentage'
        required: false
        default: '80'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv pip install --system -e ".[test]"
    
    - name: Install Ollama
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        sleep 5
    
    - name: Pull gemma4:e2b model
      run: |
        ollama pull gemma4:e2b
    
    - name: Run all tests
      run: |
        PYTHONPATH=. uv run pytest tests/ \
          --cov=src \
          --cov-report=html:tests/reports/coverage/full \
          --cov-report=xml:tests/reports/coverage/coverage.xml \
          --cov-report=term \
          --html=tests/reports/pytest/full.html \
          --self-contained-html \
          -v \
          --tb=short
    
    - name: Generate timestamp
      id: timestamp
      run: echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT
    
    - name: Check coverage threshold
      run: |
        COVERAGE=$(uv run coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//')
        THRESHOLD="${{ inputs.coverage_threshold }}"
        echo "Coverage: ${COVERAGE}%"
        echo "Threshold: ${THRESHOLD}%"
        
        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "❌ Coverage ${COVERAGE}% is below threshold (${THRESHOLD}%)"
          exit 1
        fi
        echo "✅ Coverage ${COVERAGE}% meets threshold (${THRESHOLD}%)"
    
    - name: Save comprehensive metrics
      if: always()
      run: |
        mkdir -p tests/reports/metrics
        TIMESTAMP="${{ steps.timestamp.outputs.timestamp }}"
        
        # Extract test results from pytest output
        TOTAL=$(grep -oP 'collected \K\d+' tests/reports/pytest/full.html || echo "0")
        PASSED=$(grep -oP 'passed=\K\d+' tests/reports/pytest/full.html || echo "0")
        FAILED=$(grep -oP 'failed=\K\d+' tests/reports/pytest/full.html || echo "0")
        SKIPPED=$(grep -oP 'skipped=\K\d+' tests/reports/pytest/full.html || echo "0")
        
        # Extract coverage
        COVERAGE=$(uv run coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//' || echo "0")
        
        # Create comprehensive metrics JSON
        cat > tests/reports/metrics/metrics-full-${TIMESTAMP}.json <<EOF
        {
          "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "test_phase": "full",
          "total_tests": ${TOTAL},
          "passed": ${PASSED},
          "failed": ${FAILED},
          "skipped": ${SKIPPED},
          "duration_seconds": 0,
          "coverage_percent": ${COVERAGE},
          "coverage_threshold": ${{ inputs.coverage_threshold }},
          "git_commit": "${{ github.sha }}",
          "git_branch": "${{ github.ref_name }}",
          "triggered_by": "${{ github.actor }}"
        }
        EOF
        
        echo "Comprehensive metrics saved to tests/reports/metrics/metrics-full-${TIMESTAMP}.json"
    
    - name: Generate test summary
      if: always()
      run: |
        echo "## 📊 Full Test Suite Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        TOTAL=$(grep -oP 'collected \K\d+' tests/reports/pytest/full.html || echo "0")
        PASSED=$(grep -oP 'passed=\K\d+' tests/reports/pytest/full.html || echo "0")
        FAILED=$(grep -oP 'failed=\K\d+' tests/reports/pytest/full.html || echo "0")
        SKIPPED=$(grep -oP 'skipped=\K\d+' tests/reports/pytest/full.html || echo "0")
        COVERAGE=$(uv run coverage report | grep TOTAL | awk '{print $4}' | sed 's/%//' || echo "0")
        
        echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Total Tests | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
        echo "| ✅ Passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
        echo "| ❌ Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
        echo "| ⏭️ Skipped | ${SKIPPED} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📈 Coverage | ${COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the test reports artifact for detailed results." >> $GITHUB_STEP_SUMMARY
    
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports-full-${{ steps.timestamp.outputs.timestamp }}
        path: tests/reports/
        retention-days: 90
    
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: tests/reports/coverage/coverage.xml
        flags: full
        name: full-test-coverage
    
    - name: Comment on PR (if applicable)
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = fs.readFileSync('tests/reports/coverage/coverage.xml', 'utf8');
          const match = coverage.match(/line-rate="([0-9.]+)"/);
          const coveragePercent = match ? (parseFloat(match[1]) * 100).toFixed(1) : 'N/A';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## 📊 Full Test Suite Results\n\n✅ All tests completed\n📈 Coverage: ${coveragePercent}%\n\nDownload the test reports artifact for detailed results.`
          })
