[project]
name = "gap-hunter-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docling>=2.82.0",
    "duckdb>=1.5.1",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.0.1",
    "llama-cpp-python>=0.3.20",
    "pydantic>=2.0",
    "pyinstaller>=6.19.0",
]

[project.optional-dependencies]
test = [
    "deepeval>=3.9.6",
    "hypothesis>=6.151.11",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: Fast deterministic unit tests without external dependencies",
    "integration: Integration tests with mocked LLM responses",
    "llm: Tests that make real LLM calls (expensive)",
    "golden: Golden dataset E2E tests",
    "adversarial: Adversarial and resilience tests",
]
